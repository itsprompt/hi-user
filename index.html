```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>

  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;

      font-family: "JetBrains Mono", monospace;
      background:
        radial-gradient(circle at 50% 45%, #182033 0%, #0d1117 42%, #070a0f 100%);
      color: #f5f7fa;
      overflow: hidden;
    }

    .hello {
      font-size: clamp(2.5rem, 8vw, 7rem);
      font-weight: 600;
      letter-spacing: -0.07em;

      background: linear-gradient(
        135deg,
        #ffffff 0%,
        #dbe7ff 45%,
        #8ab4ff 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 40px rgba(138, 180, 255, 0.15);

      animation: appear 900ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .cursor {
      display: inline-block;
      width: 0.08em;
      height: 0.9em;
      margin-left: 0.12em;
      vertical-align: -0.05em;

      background: #8ab4ff;
      border-radius: 2px;

      animation: blink 1s steps(1) infinite;
      box-shadow: 0 0 18px rgba(138, 180, 255, 0.6);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
        filter: blur(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <main class="hello">
    Hello World<span class="cursor"></span>
  </main>
</body>
</html>
```
